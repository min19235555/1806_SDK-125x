name: Build CPE1250S

on:
  workflow_dispatch:
    inputs:
      image_type:
        description: 'Image type: rel / flash / auto'
        required: false
        default: 'rel'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git-core libncurses5-dev zlib1g-dev \
            gawk flex quilt libssl-dev xsltproc libxml-parser-perl mercurial \
            bzr ecj cvs unzip
      - name: Update feeds
        working-directory: openwrt-18.06
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Build
        working-directory: openwrt-18.06
        run: ./make.sh a28_cpe1250s ${{ github.event.inputs.image_type || 'rel' }}
      - name: Collect image
        working-directory: openwrt-18.06
        run: |
          set -euo pipefail
          img=$(find bin/targets -type f \( -name '*squashfs-sysupgrade.bin' -o -name 'openwrt1806_*.bin' \) | head -n 1)
          if [ -z "$img" ]; then
            echo "No firmware image found under bin/targets" >&2
            find bin/targets -maxdepth 4 -type f | head -n 50 >&2 || true
            exit 1
          fi
          echo "Found image: $img"
          cp "$img" cpe1250s-sysupgrade.bin
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: cpe1250s-${{ github.event.inputs.image_type || 'rel' }}
          path: openwrt-18.06/cpe1250s-sysupgrade.bin
          if-no-files-found: error
